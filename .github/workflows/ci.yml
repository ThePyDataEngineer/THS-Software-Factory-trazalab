name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  RUST_VERSION: "1.98.1"
  CARGO_TERM_COLOR: always
  WASM_TOOL: "wasm-pack"

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          version: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Static Analysis (clippy) - visu-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          version: ${{ env.RUST_VERSION }}
          components: clippy
      - name: Run clippy (core only)
        run: cargo clippy -p visu-core --all-targets --locked -- -D warnings

  test-core:
    name: Test Core (visu-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          version: ${{ env.RUST_VERSION }}
      - name: Run native tests
        run: cargo test -p visu-core --locked

  wasm-build:
    name: Wasm Build (visu-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          version: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "0.15.1"
      - name: Build Wasm with wasm-pack
        run: |
          cd crates/visu-wasm
          wasm-pack build --release --target web --out-dir ../../web/pkg
      - name: Verify artifacts
        run: |
          ls -la web/pkg/
          test -f web/pkg/visu_wasm_bg.wasm
          sha256sum web/pkg/*.wasm > wasm-hash.txt
          cat wasm-hash.txt
      - name: Upload Wasm hash (evidence)
        uses: actions/upload-artifact@v4
        with:
          name: wasm-hash
          path: wasm-hash.txt
          retention-days: 30
