[workspace]
resolver = "2"
members = ["crates/visu-core", "crates/visu-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ThePyDataEngineer <julian@thehumansoftware.com>"]
repository = "https://github.com/ThePyDataEngineer/THS-Software-Factory---Visu.git"
description = "Visu: Motor de ordenamiento burbuja determinista en Rust/WebAssembly con traza navegable"
categories = ["simulation", "wasm", "webassembly", "algorithm"]
keywords = ["sorting", "deterministic", "webassembly", "rust", "bubble-sort"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0.209", features = ["derive"] }
thiserror = "1.0.61"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
wasm-bindgen = "0.2.98"
web-sys = "0.3.69"
js-sys = "0.3.69"
console_error_panic_hook = "0.1.7"
proptest = "1.6.0"
criterion = "0.5.1"
schemars = "0.8.18"
serde_json = "1.0.128"

[workspace.lints]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
strip = "symbols"
