name: Feature Request
description: Propuesta de nueva capacidad para Visu
title: "[FEAT] "
labels: ["type:feature", "triage"]
body:
  - type: markdown
    attributes:
      value: "Describa la capacidad, motivación y alternativas consideradas."
  - type: textarea
    id: motivation
    attributes:
      label: Motivación y caso de uso
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta técnica
      placeholder: API, tipos, cambios en contrato, fixtures
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Alcance estimado
      options:
        - visu-core (lógica determinista)
        - visu-wasm (enlace Wasm)
        - web (UI/editor)
        - fixtures/contrato
        - docs/CI
    validations:
      required: true
